<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg: #14121F;
            --card: #1C1930;
            --card-border: #2E2A47;
            --ink: #F2EFEA;
            --ink-dim: #9C97B5;
            --accent: #E8B95B;
            --accent-ink: #201A0A;
            --line: #35304F;
            --focus: #8B7FD1;
        }

        *{ box-sizing: border-box; }

        html, body{
            margin:0;
            padding:0;
            height:100%;
        }

        body{
            background:
                    radial-gradient(60% 50% at 15% 0%, rgba(139,127,209,0.16), transparent 60%),
                    radial-gradient(50% 45% at 100% 100%, rgba(232,185,91,0.10), transparent 60%),
                    var(--bg);
            color: var(--ink);
            font-family: 'Manrope', sans-serif;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding: 32px 16px;
        }

        .card{
            width:100%;
            max-width: 400px;
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 40px 36px 32px;
            position:relative;
            box-shadow: 0 30px 60px -20px rgba(0,0,0,0.55);
        }

        /* keycard notch, signature element */
        .card::before{
            content:"";
            position:absolute;
            top:-1px; right:-1px;
            width:34px; height:34px;
            background: var(--bg);
            border-left: 1px solid var(--card-border);
            border-bottom: 1px solid var(--card-border);
            border-radius: 0 20px 0 20px;
        }

        .eyebrow{
            font-size:11px;
            letter-spacing:.16em;
            text-transform:uppercase;
            color: var(--accent);
            font-weight:700;
            margin:0 0 10px;
        }

        h1{
            font-family:'Fraunces', serif;
            font-weight:600;
            font-size: 28px;
            line-height:1.15;
            margin:0 0 6px;
        }

        .sub{
            color: var(--ink-dim);
            font-size:14px;
            margin:0 0 28px;
        }

        form{
            display:flex;
            flex-direction:column;
            gap:14px;
        }

        label{
            font-size:12px;
            font-weight:600;
            color: var(--ink-dim);
            margin-bottom:6px;
            display:block;
        }

        .field{ display:flex; flex-direction:column; }

        input[type="text"],
        input[type="password"]{
            width:100%;
            background: #14121F;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 12px 14px;
            color: var(--ink);
            font-family:'Manrope', sans-serif;
            font-size: 14px;
            outline:none;
            transition: border-color .15s ease, box-shadow .15s ease;
        }

        input::placeholder{ color: #6E6A87; }

        input:focus{
            border-color: var(--focus);
            box-shadow: 0 0 0 3px rgba(139,127,209,0.25);
        }

        .primary-btn{
            margin-top: 8px;
            width:100%;
            background: var(--accent);
            color: var(--accent-ink);
            border:none;
            border-radius: 10px;
            padding: 13px 14px;
            font-size:14px;
            font-weight:700;
            font-family:'Manrope', sans-serif;
            cursor:pointer;
            transition: transform .12s ease, filter .15s ease;
        }

        .primary-btn:hover{ filter: brightness(1.08); }
        .primary-btn:active{ transform: scale(0.98); }
        .primary-btn:focus-visible{
            outline: 2px solid var(--focus);
            outline-offset: 2px;
        }

        /* perforated divider — the ticket-stub cut between direct login and OAuth */
        .divider{
            position:relative;
            display:flex;
            align-items:center;
            justify-content:center;
            margin: 30px -36px 22px;
            padding: 0 36px;
        }

        .divider::before{
            content:"";
            position:absolute;
            left:36px; right:36px; top:50%;
            border-top: 1px dashed var(--line);
        }

        .divider span{
            position:relative;
            background: var(--card);
            padding: 0 12px;
            font-size:11px;
            letter-spacing:.1em;
            text-transform:uppercase;
            color: var(--ink-dim);
            font-weight:700;
        }

        .divider::after,
        .divider .notch-l,
        .divider .notch-r{ display:none; }

        .oauth-list{
            display:flex;
            flex-direction:column;
            gap:10px;
        }

        .oauth-link{ text-decoration:none; }

        .oauth-btn{
            width:100%;
            display:flex;
            align-items:center;
            justify-content:center;
            gap:10px;
            background: #14121F;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 11px 14px;
            color: var(--ink);
            font-family:'Manrope', sans-serif;
            font-size:14px;
            font-weight:600;
            cursor:pointer;
            transition: border-color .15s ease, background .15s ease;
        }

        .oauth-btn:hover{
            border-color: var(--ink-dim);
            background: #1A1729;
        }

        .oauth-btn:focus-visible{
            outline: 2px solid var(--focus);
            outline-offset: 2px;
        }

        .oauth-btn svg{ width:18px; height:18px; flex-shrink:0; }

        @media (prefers-reduced-motion: reduce){
            .primary-btn, .oauth-btn{ transition:none; }
        }
    </style>
</head>
<body>

<div class="card">
    <p class="eyebrow">Members Access</p>
    <h1>Welcome back</h1>
    <p class="sub">Sign in to pick up where you left off.</p>

    <form action="/api/users/login" method="post">
        <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="primary-btn">Log in</button>
    </form>

    <div class="divider"><span>Or continue with</span></div>

    <div class="oauth-list">
        <a class="oauth-link" href="/oauth2/authorization/google">
            <button type="button" class="oauth-btn">
                <svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.4-1.7 4.1-5.5 4.1-3.3 0-6-2.7-6-6.2s2.7-6.2 6-6.2c1.9 0 3.1.8 3.9 1.5l2.6-2.5C16.9 3.2 14.7 2.2 12 2.2 6.9 2.2 2.7 6.4 2.7 12S6.9 21.8 12 21.8c6.9 0 9.1-4.8 9.1-7.3 0-.5 0-.9-.1-1.3H12z"/></svg>
                Continue with Google
            </button>
        </a>

        <a class="oauth-link" href="/oauth2/authorization/github">
            <button type="button" class="oauth-btn">
                <svg viewBox="0 0 24 24"><path fill="#F2EFEA" d="M12 2.2a9.8 9.8 0 0 0-3.1 19.1c.5.1.7-.2.7-.5v-1.8c-2.7.6-3.3-1.3-3.3-1.3-.4-1.1-1-1.4-1-1.4-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.9.8.1-.7.4-1.1.6-1.4-2.2-.2-4.5-1.1-4.5-4.9 0-1.1.4-2 1-2.6-.1-.2-.4-1.3.1-2.7 0 0 .8-.3 2.7 1a9.3 9.3 0 0 1 4.9 0c1.9-1.3 2.7-1 2.7-1 .5 1.4.2 2.5.1 2.7.6.6 1 1.5 1 2.6 0 3.8-2.3 4.7-4.5 4.9.4.3.7.9.7 1.9v2.8c0 .3.2.6.7.5A9.8 9.8 0 0 0 12 2.2z"/></svg>
                Continue with GitHub
            </button>
        </a>

        <a class="oauth-link" href="/oauth2/authorization/facebook">
            <button type="button" class="oauth-btn">
                <svg viewBox="0 0 24 24"><path fill="#1877F2" d="M22 12.06C22 6.5 17.5 2 12 2S2 6.5 2 12.06c0 5 3.66 9.16 8.44 9.94v-7.03H7.9v-2.9h2.54V9.85c0-2.5 1.49-3.9 3.77-3.9 1.09 0 2.23.2 2.23.2v2.45h-1.26c-1.24 0-1.63.77-1.63 1.56v1.87h2.78l-.44 2.9h-2.34V22c4.78-.78 8.44-4.94 8.44-9.94z"/></svg>
                Continue with Facebook
            </button>
        </a>
    </div>
</div>

</body>
</html>
